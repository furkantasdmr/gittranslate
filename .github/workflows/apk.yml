name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Sabit imza anahtarı: güncellemeler eski sürümün üstüne kurulabilsin.
      # 1) Repo secret'ları (IMZA_DOSYASI_B64 + IMZA_SIFRE) varsa onlar kullanılır.
      # 2) Yoksa ilk derlemede bir anahtar üretilir ve Actions önbelleğinde saklanır.
      - name: İmza anahtarını önbellekten al
        id: imza
        uses: actions/cache@v4
        with:
          path: ~/.imza
          key: gittranslate-imza-v1

      - name: İmza anahtarını hazırla
        env:
          IMZA_B64: ${{ secrets.IMZA_DOSYASI_B64 }}
          IMZA_SIFRE_SECRET: ${{ secrets.IMZA_SIFRE }}
        run: |
          mkdir -p ~/.imza
          if [ -n "$IMZA_B64" ] && [ -n "$IMZA_SIFRE_SECRET" ]; then
            echo "$IMZA_B64" | base64 -d > ~/.imza/anahtar.jks
            printf '%s' "$IMZA_SIFRE_SECRET" > ~/.imza/sifre
          fi
          if [ ! -f ~/.imza/anahtar.jks ]; then
            S=$(openssl rand -hex 24)
            keytool -genkeypair -keystore ~/.imza/anahtar.jks -storepass "$S" -keypass "$S" \
              -alias gittranslate -keyalg RSA -keysize 3072 -validity 12000 -dname "CN=GitTranslate"
            printf '%s' "$S" > ~/.imza/sifre
          fi
          echo "::add-mask::$(cat ~/.imza/sifre)"
          echo "IMZA_DOSYASI=$HOME/.imza/anahtar.jks" >> "$GITHUB_ENV"
          echo "IMZA_SIFRE=$(cat ~/.imza/sifre)" >> "$GITHUB_ENV"

      - name: Test et ve APK'yı derle
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew testReleaseUnitTest assembleRelease --stacktrace 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk GitTranslate.apk

      - name: Hataları özetle
        if: failure()
        run: |
          # Derleme hataları ve başarısız testler, Actions sayfasında "annotation" olarak görünsün
          grep -E "^e: |[Ee]rror:|What went wrong|FAILED|\.(kt|xml):[0-9]+" build.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done || true
          for f in app/build/test-results/*/*.xml; do
            [ -f "$f" ] || continue
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for tc in ET.parse(sys.argv[1]).getroot().iter('testcase'):
              for fl in list(tc.findall('failure')) + list(tc.findall('error')):
                  msg = (fl.get('message') or fl.text or '').replace('\n', ' ')[:600]
                  print(f"::error::TEST {tc.get('name')}: {msg}")
          PY
          done

      - name: İmzayı doğrula ve eski sürümlerle karşılaştır
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::notice::imza önbelleği bulundu mu: ${{ steps.imza.outputs.cache-hit }}"
          A=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)/apksigner
          parmak() { "$A" verify --print-certs "$1" | grep -m1 'SHA-256 digest' | awk '{print $NF}'; }
          "$A" verify GitTranslate.apk
          YENI=$(parmak GitTranslate.apk)
          echo "::notice::bu derleme: $YENI"
          echo "IMZA_SHA=$YENI" >> "$GITHUB_ENV"
          for t in $(gh release list -R "$GITHUB_REPOSITORY" -L 4 --json tagName -q '.[].tagName'); do
            if gh release download "$t" -R "$GITHUB_REPOSITORY" -p GitTranslate.apk -O "/tmp/$t.apk" 2>/dev/null; then
              echo "::notice::$t: $(parmak /tmp/$t.apk)"
            fi
          done

      # Sürüm sadece VERSION dosyası yeni bir numaraya geçince yayınlanır (her gönderimde değil)
      - name: Sürüm numarası
        id: surum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          echo "ad=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "yeni=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$V zaten yayında; APK sadece Actions'a yüklendi. Yeni sürüm için VERSION'u artır."
          else
            echo "yeni=true" >> "$GITHUB_OUTPUT"
          fi
          # Uygulama içi güncelleyici bu dosyadan derleme numarasını okur
          printf '{"kod":%s,"ad":"%s"}\n' "$GITHUB_RUN_NUMBER" "$V" > surum.json

      - uses: actions/upload-artifact@v4
        with:
          name: GitTranslate
          path: GitTranslate.apk

      - name: Release olarak yayınla (telefondan kolay indirmek için)
        if: steps.surum.outputs.yeni == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.surum.outputs.ad }}
          name: GitTranslate v${{ steps.surum.outputs.ad }}
          body: |
            📱 Download `GitTranslate.apk` on your phone and install it. See the README for setup.
            📱 `GitTranslate.apk` dosyasını telefonuna indirip kur. Kurulum için README'ye bak.

            🔏 SHA-256: `${{ env.IMZA_SHA }}`
          files: |
            GitTranslate.apk
            surum.json
          make_latest: true
