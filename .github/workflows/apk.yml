name: APK Derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test et ve APK'yı derle
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew testReleaseUnitTest assembleRelease --stacktrace 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk GitHub-Cevirmen.apk

      - name: Hataları özetle
        if: failure()
        run: |
          # Derleme hataları ve başarısız testler, Actions sayfasında "annotation" olarak görünsün
          grep -E "^e: |error:|What went wrong|FAILED" build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done || true
          for f in app/build/test-results/*/*.xml; do
            [ -f "$f" ] || continue
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for tc in ET.parse(sys.argv[1]).getroot().iter('testcase'):
              for fl in list(tc.findall('failure')) + list(tc.findall('error')):
                  msg = (fl.get('message') or fl.text or '').replace('\n', ' ')[:600]
                  print(f"::error::TEST {tc.get('name')}: {msg}")
          PY
          done

      - uses: actions/upload-artifact@v4
        with:
          name: GitHub-Cevirmen
          path: GitHub-Cevirmen.apk

      - name: Release olarak yayınla (telefondan kolay indirmek için)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: GitHub Çevirmen v1.0.${{ github.run_number }}
          body: Telefonuna indirip kur. Kurulum adımları için README'ye bak.
          files: GitHub-Cevirmen.apk
          make_latest: true
