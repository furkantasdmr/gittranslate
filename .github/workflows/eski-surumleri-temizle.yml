name: Eski sürümleri temizle / Clean up old releases

# Sadece elle çalışır: Actions → "Eski sürümleri temizle" → Run workflow
# Bütün release'leri ve v* etiketlerini siler, sonra güncel kodu VERSION dosyasındaki
# numarayla temiz bir şekilde yeniden yayınlar ("Build APK"). Geri alınamaz.
on:
  workflow_dispatch:
    inputs:
      kalacak:
        description: "Silinmeyecek bir sürüm etiketi varsa yaz (boş = hepsini sil) / Tag to keep (empty = delete all)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  temizle:
    runs-on: ubuntu-latest
    steps:
      - name: Release'leri ve etiketleri sil
        env:
          GH_TOKEN: ${{ github.token }}
          KALACAK: ${{ github.event.inputs.kalacak }}
        run: |
          for t in $(gh release list -R "$GITHUB_REPOSITORY" -L 200 --json tagName -q '.[].tagName'); do
            [ -n "$KALACAK" ] && [ "$t" = "$KALACAK" ] && continue
            gh release delete "$t" -R "$GITHUB_REPOSITORY" --cleanup-tag -y && echo "::notice::silindi: $t"
          done
          # Release'i olmayan eski etiketler
          for t in $(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" -q '.[].ref' | sed 's#refs/tags/##'); do
            [ -n "$KALACAK" ] && [ "$t" = "$KALACAK" ] && continue
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$t" && echo "::notice::etiket silindi: $t"
          done

      - name: Güncel sürümü yeniden yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run apk.yml -R "$GITHUB_REPOSITORY" --ref main
          echo "::notice::Build APK başlatıldı; birkaç dakika içinde yeni sürüm Releases'ta olacak."
